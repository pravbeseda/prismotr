<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}} - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        h1 { color: #333; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 10px 0; }
        a { text-decoration: none; color: #0066cc; padding: 10px; border: 1px solid #ddd; display: inline-block; }
        a:hover { background-color: #f0f0f0; }
        footer { margin-top: 40px; color: #888; font-size: 0.8em; }
    </style>
</head>
<body>
    <h1>{{.Title}} - Admin Panel</h1>
    <ul>
        {{range .Menu}}<li><a href="{{.Href}}">{{.Text}}</a></li>
        {{end}}<li><a href="/">Main Site</a></li>
    </ul>
    <footer>prismotr {{.Version}}</footer>
</body>
</html>
